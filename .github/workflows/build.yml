
name: Build Nexus PS2 Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
          run: |
            sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
            
      - name: Check AndroidManifest XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("app/src/main/AndroidManifest.xml")
          data = p.read_bytes()

          # Hapus baris kosong dan spasi sebelum XML
          data = data.lstrip(b" \t\r\n")
          p.write_bytes(data)

          print("FIRST 200 BYTES:", repr(data[:200]))

          ET.fromstring(data)
          print("MANIFEST XML VALID")
          PY

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-PS2-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
