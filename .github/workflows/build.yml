
      - name: Return to Nexus Launcher After Exit
        working-directory: external/ARMSX2/platforms/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          launcher = Path(
              "app/src/main/java/com/armsx2/NexusLauncherActivity.kt"
          )
          runtime = Path(
              "app/src/main/java/com/armsx2/runtime/MainActivityRuntime.kt"
          )

          a = launcher.read_text()
          marker = 'putExtra("com.nexus.ps2android.INTERNAL_LAUNCH", true)'

          if a.count(marker) != 1:
              raise SystemExit("Nexus launch marker missing or duplicated.")

          if a.count("startActivity(launch)") != 1:
              raise SystemExit("Launcher startActivity missing or duplicated.")

          if "finish()" in a:
              raise SystemExit("Launcher must remain alive.")

          s = runtime.read_text()

          old_flag = "        @Volatile var launchedExternally = false"
          new_flag = """        @Volatile var launchedExternally = false
        // Return to the Nexus launcher after a game launched from it stops.
        @Volatile var returnToNexusLauncher = false"""

          if s.count(old_flag) != 1:
              raise SystemExit("Runtime launch flag location changed.")

          s = s.replace(old_flag, new_flag, 1)

          new_finish = """        private fun finishToLauncherIfRequested() {
            if (quitAfterStop) {
                quitAfterStop = false
                instance?.runOnUiThread { instance?.finishAndRemoveTask() }
                return
            }

            if (returnToNexusLauncher) {
                returnToNexusLauncher = false
                instance?.runOnUiThread { instance?.finish() }
            }
        }"""

          pattern = (
              r"(?ms)^        private fun finishToLauncherIfRequested\(\) \{\n"
              r".*?^        \}"
          )

          s, count = re.subn(pattern, new_finish, s, count=1)

          if count != 1:
              raise SystemExit("Could not locate runtime exit function.")

          old_handler = """    private fun handleExternalLaunchIntent(intent: Intent?) {
        val raw = extractLaunchUri(intent) ?: return"""

          new_handler = """    private fun handleExternalLaunchIntent(intent: Intent?) {
        returnToNexusLauncher =
            intent?.getBooleanExtra("com.nexus.ps2android.INTERNAL_LAUNCH", false) == true

        val raw = extractLaunchUri(intent) ?: return"""

          if s.count(old_handler) != 1:
              raise SystemExit("External launch handler changed.")

          s = s.replace(old_handler, new_handler, 1)
          runtime.write_text(s)

          print("RETURN TO NEXUS LAUNCHER PATCHED")
          PY
          
