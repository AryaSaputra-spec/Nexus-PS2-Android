
name: Build Nexus PS2 Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nexus Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Components
        run: |
          sdkmanager "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Fix Android 37 Platform Path
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_ROOT/platforms"
          ln -sfn android-37.0 "$SDK_ROOT/platforms/android-37"
          ls -la "$SDK_ROOT/platforms"

      - name: Download ARMSX2 Source
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/ARMSX2/ARMSX2.git \
            external/ARMSX2

      - name: Download Shaderc Dependencies
        working-directory: external/ARMSX2/platforms/android/app/src/main/cpp/3rdparty/shaderc
        run: |
          python3 utils/git-sync-deps

      - name: Verify Native Dependencies
        working-directory: external/ARMSX2/platforms/android/app/src/main/cpp/3rdparty/shaderc
        run: |
          test -f third_party/spirv-tools/CMakeLists.txt
          test -f third_party/spirv-headers/CMakeLists.txt
          test -f third_party/glslang/CMakeLists.txt
          test -f third_party/effcee/CMakeLists.txt
          echo "SHADERC DEPENDENCIES VERIFIED"

      - name: Verify ARMSX2 Source
        run: |
          test -f external/ARMSX2/platforms/android/gradlew
          test -f external/ARMSX2/platforms/android/app/build.gradle.kts
          test -f external/ARMSX2/platforms/android/app/src/main/cpp/CMakeLists.txt
          echo "ARMSX2 SOURCE VERIFIED"
          git -C external/ARMSX2 rev-parse --short HEAD

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Verify Rust Android Target
        run: |
          rustc --version
          cargo --version
          rustup target list --installed
          rustup target list --installed | grep -q "aarch64-linux-android"

      - name: Install Nexus Launcher
        working-directory: external/ARMSX2/platforms/android
        run: |
          mkdir -p app/src/main/java/com/armsx2

          cat > app/src/main/java/com/armsx2/NexusLauncherActivity.kt <<'KOTLIN'
          package com.armsx2

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts

          class NexusLauncherActivity : ComponentActivity() {

              private val red = Color.rgb(210, 35, 48)
              private val silver = Color.rgb(205, 215, 225)
              private val dark = Color.rgb(9, 13, 22)

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              private fun makeShape(
                  color: Int,
                  radius: Int,
                  stroke: Int = Color.TRANSPARENT
              ) = GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dp(radius).toFloat()
                  if (stroke != Color.TRANSPARENT) {
                      setStroke(dp(1), stroke)
                  }
              }

              private fun makeText(
                  value: String,
                  size: Float,
                  color: Int,
                  bold: Boolean = false
              ) = TextView(this).apply {
                  text = value
                  textSize = size
                  setTextColor(color)
                  gravity = Gravity.CENTER
                  if (bold) typeface = Typeface.DEFAULT_BOLD
              }

              private val gamePicker =
                  registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                      if (uri == null) return@registerForActivityResult

                      val name = contentResolver.query(
                          uri,
                          arrayOf(OpenableColumns.DISPLAY_NAME),
                          null, null, null
                      )?.use { cursor ->
                          if (cursor.moveToFirst()) cursor.getString(0) else null
                      } ?: uri.lastPathSegment.orEmpty()

                      val extension = name.substringAfterLast('.', "").lowercase()

                      if (extension !in setOf("bin", "iso", "chd")) {
                          Toast.makeText(
                              this,
                              "Pilih file BIN, ISO, atau CHD. Untuk BIN/CUE pilih BIN.",
                              Toast.LENGTH_LONG
                          ).show()
                          return@registerForActivityResult
                      }

                      runCatching {
                          contentResolver.takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )
                      }

                      val launch = Intent(
                          this,
                          BootSplashActivity::class.java
                      ).apply {
                          action = Intent.ACTION_VIEW
                          data = uri
                          putExtra("com.nexus.ps2android.INTERNAL_LAUNCH", true)
                          addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION or
                              Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                          )
                      }

                      startActivity(launch)
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(dp(22), dp(28), dp(22), dp(22))
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(
                              Color.rgb(25, 29, 43),
                              dark,
                              Color.rgb(35, 12, 20)
                          )
                      )
                  }

                  val scroll = ScrollView(this).apply {
                      isFillViewport = true
                      addView(root)
                  }

                  root.addView(
                      makeText("PROJECT • NEXUS", 12f, red, true).apply {
                          letterSpacing = 0.2f
                      }
                  )

                  root.addView(
                      makeText("ULTRAMAN", 30f, silver, true).apply {
                          setPadding(0, dp(12), 0, 0)
                          letterSpacing = 0.12f
                      }
                  )

                  root.addView(
                      makeText("NEXUS", 42f, Color.WHITE, true).apply {
                          letterSpacing = 0.18f
                      }
                  )

                  val accent = View(this).apply {
                      setBackgroundColor(red)
                  }

                  root.addView(
                      accent,
                      LinearLayout.LayoutParams(dp(100), dp(3)).apply {
                          gravity = Gravity.CENTER
                          topMargin = dp(12)
                          bottomMargin = dp(18)
                      }
                  )

                  root.addView(
                      makeText(
                          "PLAYSTATION 2 ANDROID",
                          13f,
                          silver,
                          true
                      ).apply {
                          setPadding(0, 0, 0, dp(28))
                      }
                  )

                  val panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(20), dp(18), dp(20))
                      background = makeShape(
                          Color.rgb(23, 30, 43),
                          16,
                          Color.rgb(90, 100, 120)
                      )
                  }

                  panel.addView(
                      makeText(
                          "GAME CONTROL CENTER",
                          16f,
                          Color.WHITE,
                          true
                      )
                  )

                  panel.addView(
                      makeText(
                          "Pilih file game PS2 untuk memulai.",
                          13f,
                          Color.LTGRAY
                      ).apply {
                          setPadding(0, dp(12), 0, dp(20))
                      }
                  )

                  val chooseButton = Button(this).apply {
                      text = "PILIH GAME"
                      textSize = 15f
                      isAllCaps = false
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      background = makeShape(red, 12)
                      setOnClickListener {
                          gamePicker.launch(arrayOf("*/*"))
                      }
                  }

                  panel.addView(
                      chooseButton,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          dp(54)
                      )
                  )

                  root.addView(
                      panel,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  root.addView(
                      makeText(
                          "SUPPORTED GAME FILES",
                          13f,
                          red,
                          true
                      ).apply {
                          setPadding(0, dp(28), 0, dp(12))
                      }
                  )

                  root.addView(
                      makeText(
                          "BIN  •  ISO  •  CHD",
                          16f,
                          silver,
                          true
                      )
                  )

                  root.addView(
                      makeText(
                          "Untuk game BIN/CUE, pilih file BIN.\n" +
                          "BIOS PS2 diperlukan untuk menjalankan game.\n\n" +
                          "Gunakan BIOS dan game hasil dump milik sendiri.",
                          12f,
                          Color.LTGRAY
                      ).apply {
                          setPadding(dp(8), dp(20), dp(8), dp(24))
                      }
                  )

                  root.addView(
                      makeText(
                          "NEXUS PROJECT • ANDROID EDITION",
                          10f,
                          Color.GRAY
                      )
                  )

                  setContentView(scroll)
              }
          }
          KOTLIN

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"
          android = "http://schemas.android.com/apk/res/android"
          tools = "http://schemas.android.com/tools"

          ET.register_namespace("android", android)
          ET.register_namespace("tools", tools)

          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")

          if app is None:
              raise SystemExit("AndroidManifest: application not found")

          name = f"{{{android}}}name"
          exported = f"{{{android}}}exported"
          theme = f"{{{android}}}theme"

          splash = None
          for activity in app.findall("activity"):
              if activity.get(name) == ".BootSplashActivity":
                  splash = activity
                  break

          if splash is None:
              raise SystemExit("BootSplashActivity not found")

          for intent_filter in list(splash.findall("intent-filter")):
              actions = [
                  item.get(name)
                  for item in intent_filter.findall("action")
              ]
              if "android.intent.action.MAIN" in actions:
                  splash.remove(intent_filter)

          for activity in list(app.findall("activity")):
              if activity.get(name) == ".NexusLauncherActivity":
                  app.remove(activity)

          launcher = ET.SubElement(app, "activity")
          launcher.set(name, ".NexusLauncherActivity")
          launcher.set(exported, "true")
          launcher.set(theme, "@style/Theme.ARMSX2")

          intent_filter = ET.SubElement(launcher, "intent-filter")
          ET.SubElement(intent_filter, "action").set(
              name, "android.intent.action.MAIN"
          )
          ET.SubElement(intent_filter, "category").set(
              name, "android.intent.category.LAUNCHER"
          )
          ET.SubElement(intent_filter, "category").set(
              name, "android.intent.category.GAME"
          )

          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("NEXUS LAUNCHER MANIFEST INSTALLED")
          PY

      - name: Apply Nexus UI Branding
        working-directory: external/ARMSX2/platforms/android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          onboarding = Path(
              "app/src/main/java/com/armsx2/ui/onboarding/OnboardingScreen.kt"
          )
          home = Path(
              "app/src/main/java/com/armsx2/ui/home/HomeScreen.kt"
          )

          a = onboarding.read_text()
          old_logo = "                        ArmsLogo()"
          new_logo = """                        Text(
                              text = "NEXUS PS2 ANDROID",
                              style = MaterialTheme.typography.titleLarge,
                              fontWeight = FontWeight.Bold,
                              color = MaterialTheme.colorScheme.onBackground,
                          )"""

          if a.count(old_logo) != 1:
              raise SystemExit("Onboarding source changed; patch stopped.")

          onboarding.write_text(a.replace(old_logo, new_logo, 1))

          h = home.read_text()
          old_title = '                    title = str("games.section.library"),'
          new_title = '                    title = "ULTRAMAN NEXUS",'

          if h.count(old_title) != 1:
              raise SystemExit("Home source changed; patch stopped.")

          home.write_text(h.replace(old_title, new_title, 1))

          print("NEXUS UI BRANDING PATCHED")
          PY

      - name: Patch Return to Nexus Launcher After Exit
        working-directory: external/ARMSX2/platforms/android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/armsx2/runtime/MainActivityRuntime.kt"
          )
          source = path.read_text()
          nl = chr(10)

          flag = "        @Volatile var launchedExternally = false"
          if source.count(flag) != 1:
              raise SystemExit("Runtime launch flag location changed.")

          if "returnToNexusLauncher" not in source:
              source = source.replace(
                  flag,
                  flag + nl + "        @Volatile var returnToNexusLauncher = false",
                  1
              )

          old_finish = nl.join([
              "        private fun finishToLauncherIfRequested() {",
              "            if (quitAfterStop) {",
              "                quitAfterStop = false",
              "                instance?.runOnUiThread { instance?.finishAndRemoveTask() }",
              "            }",
              "        }"
          ])

          new_finish = nl.join([
              "        private fun finishToLauncherIfRequested() {",
              "            if (returnToNexusLauncher) {",
              "                quitAfterStop = false",
              "                instance?.runOnUiThread { instance?.finish() }",
              "                return",
              "            }",
              "",
              "            if (quitAfterStop) {",
              "                quitAfterStop = false",
              "                instance?.runOnUiThread { instance?.finishAndRemoveTask() }",
              "            }",
              "        }"
          ])

          if source.count(old_finish) != 1:
              raise SystemExit("Exit function changed; patch stopped.")

          source = source.replace(old_finish, new_finish, 1)

          old_destroy_tail = nl.join([
              "        val appPid = Process.myPid()",
              "        Process.killProcess(appPid)",
              "    }",
              "",
              "    private fun handleExternalLaunchIntent(intent: Intent?) {"
          ])

          new_destroy_tail = nl.join([
              "        val appPid = Process.myPid()",
              "        if (returnToNexusLauncher) {",
              "            returnToNexusLauncher = false",
              "            return",
              "        }",
              "        Process.killProcess(appPid)",
              "    }",
              "",
              "    private fun handleExternalLaunchIntent(intent: Intent?) {"
          ])

          if source.count(old_destroy_tail) != 1:
              raise SystemExit("onDestroy process-exit section changed.")

          source = source.replace(old_destroy_tail, new_destroy_tail, 1)

          handler = "private fun handleExternalLaunchIntent(intent: Intent?)"
          if source.count(handler) != 1:
              raise SystemExit("External launch handler not found or duplicated.")

          handler_start = source.index(handler)
          brace = source.index("{", handler_start)

          marker_line = (
              nl + "        returnToNexusLauncher = "
              'intent?.getBooleanExtra("com.nexus.ps2android.INTERNAL_LAUNCH", false) == true'
          )

          if marker_line.strip() not in source[handler_start:]:
              source = source[:brace + 1] + marker_line + source[brace + 1:]

          path.write_text(source)
          print("NEXUS RETURN-TO-LAUNCHER PATCH APPLIED")
          PY

      - name: Verify Return to Nexus Launcher
        run: |
          RUNTIME="external/ARMSX2/platforms/android/app/src/main/java/com/armsx2/runtime/MainActivityRuntime.kt"
          LAUNCHER="external/ARMSX2/platforms/android/app/src/main/java/com/armsx2/NexusLauncherActivity.kt"
          grep -q 'putExtra("com.nexus.ps2android.INTERNAL_LAUNCH", true)' "$LAUNCHER"
          grep -q 'returnToNexusLauncher = intent?.getBooleanExtra' "$RUNTIME"
          grep -q 'if (returnToNexusLauncher)' "$RUNTIME"
          grep -q 'instance?.finish()' 
