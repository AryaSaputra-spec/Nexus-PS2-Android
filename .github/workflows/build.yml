
name: Build Nexus PS2 Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nexus Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle disiapkan sebelum source ARMSX2 diunduh
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Components
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      # Unduh source emulator setelah Gradle siap
      - name: Download ARMSX2 Source
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/ARMSX2/ARMSX2.git \
            external/ARMSX2

      - name: Verify ARMSX2 Source
        run: |
          test -d external/ARMSX2
          test -d external/ARMSX2/platforms/android
          echo "ARMSX2 SOURCE FOUND"
          git -C external/ARMSX2 rev-parse --short HEAD
          find external/ARMSX2/platforms/android \
            -maxdepth 2 -type f | head -50

      - name: Check AndroidManifest XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("app/src/main/AndroidManifest.xml")
          data = p.read_bytes().lstrip(b" \t\r\n")
          p.write_bytes(data)

          ET.fromstring(data)
          print("MANIFEST XML VALID")
          PY

      - name: Build Nexus APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Nexus APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-PS2-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
