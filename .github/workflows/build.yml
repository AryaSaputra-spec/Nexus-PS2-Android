name: Build Nexus PS2 Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nexus Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Components
        run: |
          sdkmanager "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Fix Android 37 Platform Path
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_ROOT/platforms"
          ln -sfn android-37.0 "$SDK_ROOT/platforms/android-37"
          ls -la "$SDK_ROOT/platforms"

      - name: Download ARMSX2 Source
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/ARMSX2/ARMSX2.git \
            external/ARMSX2

      - name: Download Shaderc Dependencies
        working-directory: external/ARMSX2/platforms/android/app/src/main/cpp/3rdparty/shaderc
        run: |
          python3 utils/git-sync-deps

      - name: Verify Native Dependencies
        working-directory: external/ARMSX2/platforms/android/app/src/main/cpp/3rdparty/shaderc
        run: |
          test -f third_party/spirv-tools/CMakeLists.txt
          test -f third_party/spirv-headers/CMakeLists.txt
          test -f third_party/glslang/CMakeLists.txt
          test -f third_party/effcee/CMakeLists.txt
          echo "SHADERC DEPENDENCIES VERIFIED"

      - name: Verify ARMSX2 Source
        run: |
          test -f external/ARMSX2/platforms/android/gradlew
          test -f external/ARMSX2/platforms/android/app/build.gradle.kts
          test -f external/ARMSX2/platforms/android/app/src/main/cpp/CMakeLists.txt
          echo "ARMSX2 SOURCE VERIFIED"
          git -C external/ARMSX2 rev-parse --short HEAD

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Verify Rust Android Target
        run: |
          rustc --version
          cargo --version
          rustup target list --installed
          rustup target list --installed | grep -q "aarch64-linux-android"

      - name: Install Nexus Launcher
        working-directory: external/ARMSX2/platforms/android
        run: |
          mkdir -p app/src/main/java/com/armsx2

          cat > app/src/main/java/com/armsx2/NexusLauncherActivity.kt <<'KOTLIN'
          package com.armsx2

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts

          class NexusLauncherActivity : ComponentActivity() {

              private val gamePicker =
                  registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                      if (uri == null) return@registerForActivityResult

                      val name = contentResolver.query(
                          uri,
                          arrayOf(OpenableColumns.DISPLAY_NAME),
                          null,
                          null,
                          null
                      )?.use { cursor ->
                          if (cursor.moveToFirst()) cursor.getString(0) else null
                      } ?: uri.lastPathSegment.orEmpty()

                      val extension = name.substringAfterLast('.', "").lowercase()

                      if (extension !in setOf("bin", "iso", "chd")) {
                          Toast.makeText(
                              this,
                              "Pilih file BIN, ISO, atau CHD. Untuk BIN/CUE, pilih BIN.",
                              Toast.LENGTH_LONG
                          ).show()
                          return@registerForActivityResult
                      }

                      runCatching {
                          contentResolver.takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )
                      }

                      val launch = Intent(this, BootSplashActivity::class.java).apply {
                          action = Intent.ACTION_VIEW
                          data = uri
                          putExtra("com.nexus.ps2android.INTERNAL_LAUNCH", true)
                          addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION or
                              Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                          )
                      }

                      startActivity(launch)
                  }

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              private fun panel(
                  start: Int,
                  end: Int,
                  radius: Int,
                  stroke: Int = Color.TRANSPARENT
              ) = GradientDrawable(
                  GradientDrawable.Orientation.TOP_BOTTOM,
                  intArrayOf(start, end)
              ).apply {
                  cornerRadius = dp(radius).toFloat()
                  if (stroke != Color.TRANSPARENT) setStroke(dp(1), stroke)
              }

              private fun text(
                  value: String,
                  size: Float,
                  color: Int,
                  bold: Boolean = false,
                  gravityValue: Int = Gravity.CENTER
              ) = TextView(this).apply {
                  text = value
                  textSize = size
                  setTextColor(color)
                  gravity = gravityValue
                  if (bold) {
                      typeface = Typeface.create("sans-serif", Typeface.BOLD)
                  }
              }

              private fun space(parent: LinearLayout, height: Int) {
                  parent.addView(
                      View(this),
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          dp(height)
                      )
                  )
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = Color.rgb(5, 5, 9)
                  window.navigationBarColor = Color.rgb(5, 5, 9)

                  val scroll = ScrollView(this).apply {
                      isFillViewport = true
                      setBackgroundColor(Color.rgb(5, 5, 9))
                  }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(dp(24), dp(28), dp(24), dp(24))
                      background = panel(
                          Color.rgb(17, 19, 27),
                          Color.rgb(4, 5, 9),
                          0
                      )
                  }

                  root.addView(
                      text(
                          "T.L.T.  //  NEXUS SYSTEM",
                          11f,
                          Color.rgb(190, 195, 205),
                          true
                      ),
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          dp(30)
                      )
                  )

                  space(root, 30)

                  val emblem = text("N", 76f, Color.WHITE, true).apply {
                      background = panel(
                          Color.rgb(150, 12, 30),
                          Color.rgb(35, 5, 12),
                          100,
                          Color.rgb(210, 210, 220)
                      )
                  }

                  root.addView(
                      emblem,
                      LinearLayout.LayoutParams(dp(112), dp(112)).apply {
                          gravity = Gravity.CENTER
                      }
                  )

                  space(root, 25)

                  root.addView(
                      text("ULTRAMAN NEXUS", 27f, Color.WHITE, true),
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  space(root, 8)

                  root.addView(
                      text(
                          "PLAYSTATION 2  //  ANDROID EDITION",
                          11f,
                          Color.rgb(190, 195, 205),
                          true
                      ),
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  space(root, 38)

                  root.addView(
                      text(
                          "SYSTEM READY",
                          12f,
                          Color.rgb(230, 55, 75),
                          true
                      ),
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  space(root, 15)

                  val playButton = text(
                      "▶   PLAY GAME",
                      18f,
                      Color.WHITE,
                      true
                  ).apply {
                      background = panel(
                          Color.rgb(190, 20, 42),
                          Color.rgb(95, 5, 20),
                          16,
                          Color.rgb(225, 225, 230)
                      )
                      setPadding(dp(20), dp(19), dp(20), dp(19))
                      isClickable = true
                      isFocusable = true
                      setOnClickListener {
                          gamePicker.launch(arrayOf("*/*"))
                      }
                  }

                  root.addView(
                      playButton,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  space(root, 25)

                  val gamePanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(17), dp(18), dp(17))
                      background = panel(
                          Color.rgb(29, 31, 41),
                          Color.rgb(14, 15, 22),
                          14,
                          Color.rgb(85, 88, 100)
                      )
                  }

                  gamePanel.addView(
                      text(
                          "GAME LIBRARY",
                          13f,
                          Color.WHITE,
                          true,
                          Gravity.START
                      )
                  )

                  space(gamePanel, 8)

                  gamePanel.addView(
                      text(
                          "Pilih file game PS2 milikmu untuk memulai permainan.",
                          12f,
                          Color.rgb(185, 190, 200),
                          false,
                          Gravity.START
                      )
                  )

                  root.addView(
                      gamePanel,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  space(root, 16)

                  val biosPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(15), dp(18), dp(15))
                      background = panel(
                          Color.rgb(25, 26, 33),
                          Color.rgb(12, 13, 18),
                          14,
                          Color.rgb(65, 68, 78)
                      )
                  }

                  biosPanel.addView(
                      text(
                          "BIOS INFORMATION",
                          12f,
                          Color.rgb(220, 220, 230),
                          true,
                          Gravity.START
                      )
                  )

                  space(biosPanel, 7)

                  biosPanel.addView(
                      text(
                          "BIOS PS2 diperlukan agar emulator dapat menjalankan game.",
                          12f,
                          Color.rgb(175, 180, 190),
                          false,
                          Gravity.START
                      )
                  )

                  root.addView(
                      biosPanel,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  space(root, 30)

                  root.addView(
                      text(
                          "NEXUS PS2 ANDROID\nPOWERED BY ARMSX2",
                          10f,
                          Color.rgb(115, 120, 132),
                          true
                      ),
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  scroll.addView(root)
                  setContentView(scroll)
              }
          }
          KOTLIN

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"
          android = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", android)
          tree = ET.parse(path)
          root = tree.getroot()

          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest: application not found")

          name = f"{{{android}}}name"
          exported = f"{{{android}}}exported"
          theme = f"{{{android}}}theme"

          splash = None
          for activity in app.findall("activity"):
              if activity.get(name) == ".BootSplashActivity":
                  splash = activity
                  break

          if splash is None:
              raise SystemExit("BootSplashActivity not found")

          for intent_filter in list(splash.findall("intent-filter")):
              actions = [
                  item.get(name)
                  for item in intent_filter.findall("action")
              ]
              if "android.intent.action.MAIN" in actions:
                  splash.remove(intent_filter)

          for activity in list(app.findall("activity")):
              if activity.get(name) == ".NexusLauncherActivity":
                  app.remove(activity)

          launcher = ET.SubElement(app, "activity")
          launcher.set(name, ".NexusLauncherActivity")
          launcher.set(exported, "true")
          launcher.set(theme, "@style/Theme.ARMSX2")

          intent_filter = ET.SubElement(launcher, "intent-filter")
          ET.SubElement(intent_filter, "action").set(
              name, "android.intent.action.MAIN"
          )
          ET.SubElement(intent_filter, "category").set(
              name, "android.intent.category.LAUNCHER"
          )
          ET.SubElement(intent_filter, "category").set(
              name, "android.intent.category.GAME"
          )

          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("NEXUS LAUNCHER MANIFEST INSTALLED")
          PY

      - name: Apply Nexus UI Branding
        working-directory: external/ARMSX2/platforms/android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          onboarding = Path(
              "app/src/main/java/com/armsx2/ui/onboarding/OnboardingScreen.kt"
          )
          home = Path(
              "app/src/main/java/com/armsx2/ui/home/HomeScreen.kt"
          )

          a = onboarding.read_text()
          old_logo = "                        ArmsLogo()"
          new_logo = """                        Text(
                              text = "NEXUS PS2 ANDROID",
                              style = MaterialTheme.typography.titleLarge,
                              fontWeight = FontWeight.Bold,
                              color = MaterialTheme.colorScheme.onBackground,
                          )"""

          if a.count(old_logo) != 1:
              raise SystemExit("Onboarding source changed; patch stopped.")

          onboarding.write_text(a.replace(old_logo, new_logo, 1))

          h = home.read_text()
          old_title = '                    title = str("games.section.library"),'
          new_title = '                    title = "ULTRAMAN NEXUS",'

          if h.count(old_title) != 1:
              raise SystemExit("Home source changed; patch stopped.")

          home.write_text(h.replace(old_title, new_title, 1))

          print("NEXUS UI BRANDING PATCHED")
          PY

      - name: Patch Return to Nexus Launcher After Exit
        working-directory: external/ARMSX2/platforms/android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/armsx2/runtime/MainActivityRuntime.kt"
          )

          source = path.read_text()

          class_anchor = (
              "open class MainActivityRuntime : ComponentActivity() {\n"
          )

          if "private var returnToNexusLauncher" not in source:
              if source.count(class_anchor) != 1:
                  raise SystemExit("MainActivityRuntime class anchor not found.")

              source = source.replace(
                  class_anchor,
                  class_anchor
                  + "    private var returnToNexusLauncher = false\n",
                  1
              )

          launch_anchor = (
              "    private fun handleExternalLaunchIntent(intent: Intent?) {\n"
              "        val raw = extractCueToTrack(intent) ?: return\n"
          )

          launch_replacement = (
              "    private fun handleExternalLaunchIntent(intent: Intent?) {\n"
              "        returnToNexusLauncher = "
              "intent?.getBooleanExtra("
              '"com.nexus.ps2android.INTERNAL_LAUNCH", false'
              ") == true\n"
              "        val raw = extractCueToTrack(intent) ?: return\n"
          )

          if launch_anchor in source:
              source = source.replace(
                  launch_anchor,
                  launch_replacement,
                  1
              )
          elif "return
