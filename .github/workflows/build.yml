
name: Build Nexus PS2 Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nexus Project
        uses: actions/checkout@v4

      - name: Download ARMSX2 Source
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/ARMSX2/ARMSX2.git \
            external/ARMSX2

      - name: Verify ARMSX2 Source
        run: |
          if [ ! -d "external/ARMSX2" ]; then
            echo "ERROR: ARMSX2 source not found"
            exit 1
          fi

          if [ ! -f "external/ARMSX2/platforms/android/README.md" ]; then
            echo "ERROR: Android build documentation not found"
            exit 1
          fi

          echo "ARMSX2 SOURCE FOUND"
          echo "ANDROID BUILD DOCUMENTATION FOUND"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Components
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Check Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("app/src/main/AndroidManifest.xml")
          data = p.read_bytes().lstrip(b" \t\r\n")
          p.write_bytes(data)
          ET.fromstring(data)
          print("MANIFEST XML VALID")
          PY

      - name: Build Nexus APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Nexus APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-PS2-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload ARMSX2 Source
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-Source
          path: external/ARMSX2/
          
